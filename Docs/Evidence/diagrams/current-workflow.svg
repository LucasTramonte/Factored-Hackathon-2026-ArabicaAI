  <path d="M235 598 H282" class="edge"/><path d="M437 598 H484" class="edge"/><path d="M639 598 H686" class="edge"/><path d="M861 598 H908" class="edge"/><path d="M1078 598 H1125" class="edge"/>
  <path d="M1245 556 V420" class="edge"/>
