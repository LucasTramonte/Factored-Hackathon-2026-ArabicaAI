  <rect x="465" y="305" width="350" height="115" class="node"/>
  <text x="485" y="337" class="heading">Cloudflare Worker</text>
  <text x="485" y="366" class="body">Session · role + ownership checks</text>
  <text x="485" y="392" class="body">Intake · reports · human review</text>
  <path d="M640 260 V305" class="edge"/>
  <text x="659" y="289" class="note">Verify token</text>
  <path d="M325 344 H465" class="edge"/>
  <text x="336" y="333" class="note">HTTPS API</text>
  <rect x="1080" y="305" width="290" height="115" class="node"/>
  <text x="1100" y="337" class="heading">D1 · SQLite</text>
  <text x="1100" y="366" class="body">Cases · sessions · events</text>
  <text x="1100" y="392" class="body">Reviewed serving slice</text>
  <path d="M815 363 H1080" class="edge"/>
  <text x="850" y="350" class="note">store/d1.js · all SQL</text>
  <rect x="1080" y="184" width="290" height="76" class="node"/>
  <text x="1100" y="216" class="heading">Amazon SES · sandbox</text>
  <text x="1100" y="243" class="body">Verified recipients only</text>
  <path d="M815 328 H966 V222 H1080" class="edge"/>
  <text x="850" y="282" class="note">Email after response</text>
  <text x="55" y="445" class="note">Case reference only after read-back · identity from session · no refund, card block or fraud verdict</text>

  <rect x="30" y="485" width="1380" height="205" rx="18" fill="#eaf0f7"/>
  <text x="55" y="522" class="heading">Offline data · Python + DuckDB · bounded serving slice</text>
