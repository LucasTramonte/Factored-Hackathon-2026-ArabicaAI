  <rect x="30" y="710" width="1380" height="230" rx="18" fill="#fff3d9"/>
  <text x="55" y="748" class="heading">Offline learned evaluation · Bedrock transport built · frozen comparison NOT RUN</text>
  <rect x="55" y="787" width="350" height="100" class="pending"/>
  <text x="75" y="819" class="heading">Authored ES / PT workload</text>
  <text x="75" y="848" class="body">Development revision pending</text>
