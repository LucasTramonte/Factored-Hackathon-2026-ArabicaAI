<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1040" viewBox="0 0 1440 1040" role="img" aria-labelledby="title description">
  <title id="title">ArabicaAI: recorded deployment and offline evaluation</title>
  <desc id="description">The recorded v0.2.0 deployment serves an Angular browser through Cloudflare Worker and D1 with Cognito email authentication and SES sandbox notification delivery. A read-only S3 batch goes through Bronze, Silver, quality and Gold to a reviewed D1 seed. Offline learned evaluation uses Bedrock and deterministic policy; its approved development revision and frozen run remain pending. App changes in PRs 87 through 90 are unmerged. The Lambda and Postgres AWS target has never been deployed.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#41556b"/></marker>
    <style>
      text { font-family: Arial, sans-serif; fill: #193247; }
      .title { font-size: 30px; font-weight: 700; }
      .heading { font-size: 22px; font-weight: 700; }
      .body { font-size: 19px; }
      .note { font-size: 17px; fill: #465d71; }
      .node { fill: #fff; stroke: #438383; stroke-width: 2; rx: 12; }
      .batch { fill: #fff; stroke: #73859b; stroke-width: 2; rx: 12; }
      .pending { fill: #fff; stroke: #a87b29; stroke-width: 2; stroke-dasharray: 7 5; rx: 12; }
      .edge { fill: none; stroke: #41556b; stroke-width: 2; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect width="1440" height="1040" fill="#f6f8fb"/>
  <text x="40" y="49" class="title">ArabicaAI · recorded deployment + offline evaluation</text>
  <text x="40" y="79" class="note">Status: 2026-10-03 · solid: recorded v0.2.0 / existing batch · dashed: evaluation awaiting approval</text>

  <rect x="30" y="105" width="1380" height="360" rx="18" fill="#eaf4f2"/>
  <text x="55" y="139" class="heading">Online · Cloudflare Worker + D1 · v0.2.0</text>
  <text x="55" y="164" class="note">Recorded release: Worker f76c7f7b · main-64ae03a · D1 migrations 0001–0017 · extractor OFF</text>
  <rect x="55" y="280" width="270" height="100" class="node"/>
  <text x="75" y="312" class="heading">Angular browser</text>
  <text x="75" y="341" class="body">Customer · agent · admin</text>
  <text x="75" y="366" class="body">Auditor · ES / PT / EN</text>
  <rect x="465" y="184" width="350" height="76" class="node"/>
  <text x="485" y="216" class="heading">Amazon Cognito</text>
  <text x="485" y="243" class="body">Email code → verified ID token</text>
