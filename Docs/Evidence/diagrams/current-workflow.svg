  <rect x="527" y="787" width="340" height="100" class="pending"/>
  <text x="547" y="819" class="heading">Amazon Bedrock</text>
  <text x="547" y="848" class="body">gpt-oss-20b · facts only</text>
  <text x="547" y="874" class="body">Synthetic messages · no tools</text>
  <rect x="990" y="787" width="380" height="100" class="pending"/>
  <text x="1010" y="819" class="heading">Deterministic policy + scorer</text>
  <text x="1010" y="848" class="body">Same cases: checklist vs model</text>
  <text x="1010" y="874" class="body">Counts · safety · latency · tokens</text>
  <path d="M405 837 H527" class="edge"/><text x="433" y="825" class="note">Message</text>
  <path d="M867 837 H990" class="edge"/><text x="889" y="825" class="note">Facts</text>
  <text x="55" y="917" class="note">No online Bedrock call · Manoella approval → isolated builder → development triggers → registration → human tag</text>

  <text x="40" y="980" class="body">Built, unmerged: app review changes #87–#90. They are not part of the recorded release above.</text>
  <text x="40" y="1012" class="body">AWS Lambda + Postgres production target: design and cost estimate only; never deployed.</text>
</svg>
