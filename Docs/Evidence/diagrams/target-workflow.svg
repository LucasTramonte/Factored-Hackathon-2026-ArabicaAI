<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1180" viewBox="0 0 1600 1180" role="img" aria-labelledby="title description" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">
<title id="title">ArabicaAI: target intake workflow with online AI suggestions</title>
<desc id="description">The customer request stays deterministic and returns a reference after read-back. When the customer cannot find the charge, a model on Vertex AI reads the description after the response, deterministic code suggests up to three of the customer's own charges, the customer confirms one, and a person reviews. Every failure falls back to the incomplete handoff used today. Events without text feed the pilot measures and the offline evaluation.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#41556b"/></marker><marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c5221f"/></marker></defs>
<rect width="1600" height="1180" fill="#ffffff"/>
<text x="40" y="46" font-size="26" font-weight="700" fill="#16191f">ArabicaAI · target workflow with online AI suggestions</text>
<text x="40" y="72" font-size="14" fill="#414d5c">Planned (Docs/Plans/ai-suggestion-plan.md, ADR-012). Today the switch is off and the flow is the deterministic part only. Solid: synchronous request · dashed: after the response · red: fallback.</text>
