<text x="54" y="415" font-size="18" font-weight="700" fill="#16191f">2 · AI suggestion, only for “I can't find it”, after the reference is returned</text>
<text x="54" y="437" font-size="13" fill="#414d5c">ctx.waitUntil (Cloud Tasks in the GCP target). The model reads text; code decides; the customer confirms; a person reviews.</text>
