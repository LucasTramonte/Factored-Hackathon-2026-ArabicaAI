name: quality

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.10"

      - name: Install pipeline dependencies
        run: python -m pip install -r data_pipelines/bronze/requirements.txt

      - name: Run pipeline tests
        run: python -m pytest data_pipelines data_foundation/tests evals/intake -q

      - name: Compile pipeline package
        run: python -m compileall -q data_pipelines data_foundation evals

  web:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            front-end/package-lock.json
            back-end/package-lock.json

      - name: Install front-end and back-end dependencies
        run: |
          npm --prefix front-end ci
          npm --prefix back-end ci

      - name: Run Angular specs
        run: npm --prefix front-end test -- --watch=false --browsers=ChromeHeadless

      - name: Build the client and bundle it into the Worker
        run: |
          npm --prefix front-end run build
          npm --prefix back-end run prepare-assets

      - name: Run Worker unit and local D1 integration tests
        run: npm --prefix back-end test
