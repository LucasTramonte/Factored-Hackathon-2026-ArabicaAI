name: quality

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.10"

      - name: Install pipeline dependencies
        run: python -m pip install -r data_pipelines/bronze/requirements.txt

      - name: Run pipeline tests
        run: python -m pytest data_pipelines -q

      - name: Compile pipeline package
        run: python -m compileall -q data_pipelines

      - name: Build code-only test image
        run: docker build --tag latam-bank-pipeline:test .

      - name: Run offline tests in image
        run: docker run --rm latam-bank-pipeline:test
