name: quality

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A new push to a PR cancels that PR's run still in progress, so minutes go to the latest commit only (private
# repository: Actions minutes are metered). Runs on main are never cancelled: the deploy waits for each of them.
concurrency:
  group: quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0

      # Required checks always run and report. On a PR, each suite runs only when the change touches something it
      # tests (scripts/ci_scope.sh; anything unrecognized runs everything). main always runs everything: the deploy
      # waits for it.
      - name: Decide which suites the change needs
        id: scope
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          # Fails closed: a diff that can't be computed counts as "everything changed", and pipefail stops the job
          # if the classifier itself fails (its outputs would be missing and every suite skipped).
          set -o pipefail
          if [ "${{ github.event_name }}" = "pull_request" ] && files=$(git diff --name-only "$BASE"...HEAD); then
            printf '%s\n' "$files" | bash scripts/ci_scope.sh | tee -a "$GITHUB_OUTPUT"
          else
            printf 'python=true\nangular=true\nworker=true\n' | tee -a "$GITHUB_OUTPUT"
          fi

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.10"

      - name: Install pipeline dependencies
        if: steps.scope.outputs.python == 'true'
        run: python -m pip install -r data_pipelines/bronze/requirements.txt

      # In parallel (pytest-xdist): about 500 small DuckDB tests, so the job stays inside one billed minute.
      - name: Run pipeline tests
        if: steps.scope.outputs.python == 'true'
        run: python -m pytest data_pipelines data_foundation/tests data_profiles/findings evals/intake intake_agent scripts -q -n auto

      - name: Compile pipeline package
        if: steps.scope.outputs.python == 'true'
        run: python -m compileall -q data_pipelines data_foundation data_profiles/findings evals intake_agent

      - name: Check relative Markdown links and anchors
        run: python scripts/check_doc_links.py

  web:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0

      # Required checks always run and report. On a PR, each suite runs only when the change touches something it
      # tests (scripts/ci_scope.sh; anything unrecognized runs everything). main always runs everything: the deploy
      # waits for it.
      - name: Decide which suites the change needs
        id: scope
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          # Fails closed: a diff that can't be computed counts as "everything changed", and pipefail stops the job
          # if the classifier itself fails (its outputs would be missing and every suite skipped).
          set -o pipefail
          if [ "${{ github.event_name }}" = "pull_request" ] && files=$(git diff --name-only "$BASE"...HEAD); then
            printf '%s\n' "$files" | bash scripts/ci_scope.sh | tee -a "$GITHUB_OUTPUT"
          else
            printf 'python=true\nangular=true\nworker=true\n' | tee -a "$GITHUB_OUTPUT"
          fi

      - name: Set up Node
        if: steps.scope.outputs.angular == 'true' || steps.scope.outputs.worker == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            front-end/package-lock.json
            back-end/package-lock.json

      - name: Set up Python for the intake episode scorer
        if: steps.scope.outputs.worker == 'true'
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.10"

      - name: Install front-end and back-end dependencies
        if: steps.scope.outputs.angular == 'true' || steps.scope.outputs.worker == 'true'
        run: |
          npm --prefix front-end ci
          npm --prefix back-end ci

      - name: Run Angular specs
        if: steps.scope.outputs.angular == 'true'
        run: npm --prefix front-end test -- --watch=false --browsers=ChromeHeadless

      # The Worker tests serve the built client, so the build runs for either suite.
      - name: Build the client and bundle it into the Worker
        if: steps.scope.outputs.angular == 'true' || steps.scope.outputs.worker == 'true'
        run: |
          npm --prefix front-end run build
          npm --prefix back-end run prepare-assets

      - name: Run Worker unit and local D1 integration tests
        if: steps.scope.outputs.worker == 'true'
        env:
          # The event exporter validates with evals/intake/episodes.py, which needs only the standard library.
          INTAKE_PYTHON: python
        run: npm --prefix back-end test
