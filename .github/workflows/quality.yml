name: quality

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Run tests
        run: python -m unittest discover -s analysis/tests -v

      - name: Compile analysis package
        run: python -m compileall -q analysis

      - name: Build code-only test image
        run: docker build --tag latam-bank-analysis:test .