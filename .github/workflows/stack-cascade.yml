name: stack-cascade

# After a squash merge into main, merge forward (never rebase) into the open
# PRs stacked on the merged one. See scripts/stack-cascade.sh.
on:
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: stack-cascade
  cancel-in-progress: false

jobs:
  cascade:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Merge main forward through the stack
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Run a copy: the script checks out other branches, which may change or remove scripts/.
          cp scripts/stack-cascade.sh "$RUNNER_TEMP/stack-cascade.sh"
          bash "$RUNNER_TEMP/stack-cascade.sh" "${{ github.event.pull_request.head.sha }}" "${{ github.event.pull_request.number }}"
